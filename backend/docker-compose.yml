version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: car_dealership_db
    environment:
      POSTGRES_DB: car_dealership
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: .
    container_name: car_dealership_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_NAME: car_dealership
      JWT_SECRET: car-dealership-secret-key-2024-very-secure-and-long
      NODE_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
